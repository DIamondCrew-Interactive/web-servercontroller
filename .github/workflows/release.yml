name: Test, build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      DCI_UPSTREAM: build/upstream
      DCI_BROWSER: chrome
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Check version and tag
        id: version
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = pathlib.Path('VERSION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Invalid VERSION'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and VERSION differ'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - name: Fetch SHA256-pinned public Debian test assets
        run: python scripts/fetch_test_upstream.py
      - name: Install assertion test dependency
        run: python -m pip install cryptography==48.0.1
      - name: Python tests and shell syntax
        run: |
          python -m unittest discover -s tests -v
          for script in scripts/*.sh; do sh -n "$script"; done
      - name: Build overlays and static preview
        run: |
          python scripts/build.py --upstream build/upstream --output build/overlay
          python scripts/preview.py --upstream build/upstream
      - name: Browser tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chrome
          npm run test:browser
      - name: Build source archive and verify SHA256
        run: |
          python scripts/package.py
          cd dist
          sha256sum -c SHA256SUMS
          sha256sum *.tar.gz >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            build/browser-results.json
            build/screenshots/
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: test-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
          path: dist
      - name: Verify and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DCI_VERSION: ${{ needs.test-build.outputs.version }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            "dist/diamondcrew-servercontroller-${DCI_VERSION}.tar.gz" dist/SHA256SUMS \
            --verify-tag --draft \
            --title "DiamondCrew Interactive / Server Controller ${DCI_VERSION}" \
            --notes-file docs/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
